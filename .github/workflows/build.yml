name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to publish releases on tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file SnapAsk.exe
        run: >
          dotnet publish windows/SnapAsk/SnapAsk.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -o out
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out/SnapAsk.exe -DestinationPath SnapAsk-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SnapAsk-Windows-x64
          path: SnapAsk-Windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SnapAsk.app (ad-hoc signed)
        run: ./macos/build.sh --no-install
      - name: Zip
        run: cd macos/build && ditto -c -k --keepParent SnapAsk.app ../../SnapAsk-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SnapAsk-macOS-arm64
          path: SnapAsk-macOS-arm64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" SnapAsk-Windows-x64.zip SnapAsk-macOS-arm64.zip
          --repo "$GITHUB_REPOSITORY" --title "SnapAsk $GITHUB_REF_NAME" --generate-notes
